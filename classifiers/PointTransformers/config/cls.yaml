batch_size: 20  # 27
epoch: 250  # 500
learning_rate: 0.00005 # 0.0005
gpu: 0
optimizer: Adam
weight_decay: 0.0001
normal: true
model:
  nneighbor: 16
  nblocks: 4  # TODO: What does this parameter do
  transformer_dim: 128  # TODO: Investigate if I could decrease this ... Should save lots of memory
  name: Hengshuang
# Which features to use (we always use xyz)
features_to_create:
  use_label: true  # class label
  use_jde: true  # joint differential entropy
  use_sde: true  # separate differential entropy
  use_sd: true  # sinkhorn divergence
  use_c: true # covisibility weight
  use_s: false  # static weight
  use_cj: true  # joint cardinality ratio
  use_cs: true  # separate cardinality ratio
features_to_use:
  use_label: true  # class label
  use_jde: true  # joint differential entropy
  use_sde: true  # separate differential entropy
  use_sd: true  # sinkhorn divergence
  use_c: true  # covisibility weight
  use_s: false  # static weight
  use_cj: true  # joint cardinality ratio
  use_cs: true  # separate cardinality ratio
batch_size_feature_extraction: 256
# Covisibility parameters (see Katz and Tal)
covisibilty:
  inversion_kernel: "exponential"  # spherical_flipping is the other choice
  gamma: -0.0001   # Parameter for the exponential inversion kernel
  hpr_radius: 3.25  # Parameter for the spherical flipping method
# Data setup
num_point: 1024  # 512
re_use_data: false
n_scenes: 335
n_samples_per_scene: 40
dataset: 'v1.0-trainval'  # 'v1.0-trainval'
feature_folder: '/home/luddi824/thesis/PCAC/data/PCAC_data'  # TODO: Set by new user ...
downsample_factor: 1  # Make sure that the point cloud is not so downsampled that num_point does not exist
train_ratio: 0.70
# Perturbation settings
perturb_settings:
  n_classes: 10
  r_bin: 0.01
  t_bin: 0.1
  class_distribution: uniform
# Other settings
debug: false
#load_model_path: "/home/luddi824/thesis/PCAC/outputs/2023-07-23/12-36-00/best_model.pth"
load_model_path: false
# Plot settings
ablation: false
plot_train_acc: true